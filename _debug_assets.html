<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#20242b; color:#fff; font-family:monospace; margin:12px; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
  figure { margin:0; text-align:center; }
  .cell { position:relative; width:100%; aspect-ratio:1; background:#8ea8c8; overflow:hidden; border:1px solid #000; }
  .cell > div { position:absolute; inset:0; }
  .cell svg { width:100%; height:100%; display:block; }
  figcaption { font-size:11px; padding-top:4px; }
  h2 { margin:18px 0 8px; font-size:14px; }
</style>
</head>
<body>
<h1>studio-tshirt assets — regular fit (body-tinted like the app)</h1>
<div class="grid" id="grid"></div>
<script>
const FABRIC = '#5C7FB6';
const INNER = '#a9bed8';
const INK = '#141414';
const items = [
  ['Neck/Crew neck (regular).svg', FABRIC],
  ['Neck/V-neck (regular).svg', FABRIC],
  ['Body/Body (regular).svg', FABRIC],
  ['Body/Body V-neck (regular).svg', FABRIC],
  ['Inner back neck/Inner back neck (regular).svg', INNER],
  ['Inner back neck/Inner back neck V-neck (regular).svg', INNER],
  ['Outline/Outline (regular).svg', INK],
  ['Outline/Outline V-neck (regular).svg', INK],
  ['Stitching/Cover stitch (regular).svg', '#B0B0B0'],
  ['Stitching/Cover stitch V-neck (regular).svg', '#B0B0B0'],
];
function tint(svg, fill) {
  let s = svg.replace(/width="2048[^"]*"/i, 'width="100%"').replace(/height="2048[^"]*"/i, 'height="100%"');
  s = s.replace(/(<g transform="[^"]+")[^>]*fill="#000000"[^>]*>/i, `$1 fill="${fill}" fill-rule="evenodd">`);
  return s;
}
const grid = document.getElementById('grid');
for (const [name, fill] of items) {
  const fig = document.createElement('figure');
  const cell = document.createElement('div');
  cell.className = 'cell';
  const holder = document.createElement('div');
  cell.appendChild(holder);
  const cap = document.createElement('figcaption');
  cap.textContent = name;
  fig.appendChild(cell); fig.appendChild(cap);
  grid.appendChild(fig);
  fetch('/src/assets/studio-tshirt/' + encodeURIComponent(name))
    .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.text(); })
    .then(svg => { holder.innerHTML = tint(svg, fill); })
    .catch(err => { cap.textContent = name + ' — ERR ' + err.message; });
}
</script>
</body>
</html>
